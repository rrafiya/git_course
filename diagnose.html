<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e1c'/%3E%3Cpath d='M16 5l5 12-5 3-5-3z' fill='%237fe9ff'/%3E%3Cpath d='M16 20l3 7-3-2-3 2z' fill='%23ff6b8a'/%3E%3C/svg%3E">
<title>雷霆战机 · 显示问题诊断</title>
<style>
  /* 本页样式全部使用 .diagPanel / #diag* 前缀，避免与稍后注入的游戏样式
     （* / html,body / #wrap / canvas / #hint）冲突。
     游戏样式注入后会覆盖 body 等全局规则 —— 与真实页面行为一致。 */
  .diagPanel {
    position:fixed; top:0; right:0; width:390px; height:100%;
    overflow-y:auto; z-index:2147483000;
    background:rgba(10,14,28,.94); color:#c8d6f5;
    border-left:1px solid #1e2a52; padding:14px;
    font:13px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  .diagPanel.hidden { display:none; }
  .diagPanel h1 { font-size:16px; color:#9fe8ff; margin:0 0 2px; }
  .diagPanel .sub { color:#5f7199; font-size:11px; margin-bottom:10px; }
  .diagPanel .verdict { padding:10px 12px; border-radius:8px; font-size:15px;
    font-weight:700; margin-bottom:10px; border:2px solid; }
  .diagPanel .ok   { background:#0d2a1a; border-color:#2fbf71; color:#7df5b0; }
  .diagPanel .bad  { background:#2a0d14; border-color:#ff4d6d; color:#ff9db0; }
  .diagPanel .warn { background:#2a240d; border-color:#e0b13a; color:#ffe08a; }
  .diagPanel table { border-collapse:collapse; width:100%; font-size:12px; margin-bottom:10px; }
  .diagPanel th, .diagPanel td { border:1px solid #1e2a52; padding:4px 6px; text-align:left; vertical-align:top; }
  .diagPanel th { background:#131c38; color:#8ea2cc; font-weight:600; }
  .diagPanel td.v { font-family:Consolas,monospace; color:#e8f0ff; word-break:break-all; }
  .diagPanel .fail { color:#ff6b8a; font-weight:700; }
  .diagPanel button {
    background:#1b2950; color:#cfe4ff; border:1px solid #33518f; border-radius:6px;
    padding:6px 10px; font-size:12px; cursor:pointer; margin:0 5px 6px 0; font-family:inherit;
  }
  .diagPanel button:hover { background:#24396b; }
  .diagPanel .report {
    background:#0d1428; border:1px solid #1e2a52; border-radius:6px; padding:9px;
    font-family:Consolas,monospace; font-size:11px; color:#9db4de;
    white-space:pre-wrap; word-break:break-all; max-height:240px; overflow:auto;
  }
  .diagPanel .note { font-size:11px; color:#5f7199; margin:8px 0; }
  .diagTab {
    position:fixed; top:10px; right:10px; z-index:2147483001;
    background:#1b2950; color:#cfe4ff; border:1px solid #33518f; border-radius:6px;
    padding:7px 11px; font-size:12px; cursor:pointer;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  .diagTab.hidden { display:none; }
  #diagOutline {
    position:fixed; border:2px solid #ff3b6b; pointer-events:none; z-index:2147482999;
    display:none; box-shadow:0 0 12px rgba(255,59,107,.85);
  }
  #diagOutline::after {
    content:'画布边界'; position:absolute; top:-19px; left:0;
    background:#ff3b6b; color:#fff; font-size:10px; padding:1px 5px; border-radius:3px;
    white-space:nowrap;
  }
  #diagShell { position:fixed; inset:0; overflow:hidden; }
</style>
</head>
<body>

<div id="diagShell"></div>
<div id="diagOutline"></div>
<button class="diagTab" id="diagShow">📋 诊断面板</button>

<div class="diagPanel" id="diagPanel">
  <h1>显示问题诊断</h1>
  <div class="sub">游戏在<strong>本页面内直接运行</strong>（不使用 iframe，因此不受 file:// 跨域限制）。</div>
  <div class="verdict warn" id="diagVerdict">正在加载游戏…</div>
  <div id="diagPick" style="display:none; margin-bottom:10px; padding:10px; border:1px dashed #33518f; border-radius:8px; background:#101a34;">
    <div style="font-size:12px; color:#9db4de; margin-bottom:8px;">
      请选择<strong>本项目文件夹里的 <code>index.html</code></strong>：
    </div>
    <input type="file" id="diagFile" accept=".html,text/html"
           style="font-size:12px; color:#cfe4ff; max-width:100%;">
  </div>
  <div>
    <button id="diagOutlineBtn">显示/隐藏画布边界</button>
    <button id="diagSizeBtn">测试多种窗口尺寸</button>
    <button id="diagCopyBtn">复制诊断报告</button>
    <button id="diagOpenBtn">打开游戏原页</button>
    <button id="diagHideBtn">隐藏面板</button>
  </div>
  <table><thead><tr><th style="width:38%">项目</th><th>实测值</th></tr></thead><tbody id="diagRows"></tbody></table>
  <div class="note">若红色边框超出<strong>窗口</strong>，或表格里出现 <span class="fail">✗</span>，说明画布确实溢出了可见区域。点「复制诊断报告」把结果发我。</div>
  <div class="report" id="diagReport">等待数据…</div>
</div>

<script>
(function () {
  'use strict';

  var shell = document.getElementById('diagShell');
  var outline = document.getElementById('diagOutline');
  var panel = document.getElementById('diagPanel');
  var tab = document.getElementById('diagShow');
  var rows = document.getElementById('diagRows');
  var verdict = document.getElementById('diagVerdict');
  var report = document.getElementById('diagReport');
  var showOutline = true;
  var loadError = null;

  // ---------------------------------------------------------------- 加载游戏到本页面
  // 不用 iframe：iframe 在 file:// 下是不透明来源，访问 contentWindow/contentDocument
  // 会被浏览器拒绝（"无法访问 iframe 内容（跨域限制）"）。
  //
  // 加载策略（都会把游戏注入到本页面同一文档内运行）：
  //   1) 若通过 http(s):// 提供：直接 fetch('index.html')
  //   2) 若通过 file:// 打开：fetch 会被 CORS 拒绝，改为让用户用文件选择器
  //      选择 index.html —— FileReader 读取用户主动选择的文件不受来源限制
  var fileInput = document.getElementById('diagFile');
  var pickWrap = document.getElementById('diagPick');
  var needFile = false;      // true 表示在等用户选择文件（此时不要报"未找到画布"）

  function inject(html) {
    if (!/<canvas[\s>]/i.test(html)) {
      loadError = '所选文件看起来不是游戏页面（未找到 canvas）';
      render();
      return;
    }
    // 1) 注入 <style>
    var st = html.match(/<style[^>]*>([\s\S]*?)<\/style>/i);
    if (st) {
      var s = document.createElement('style');
      s.textContent = st[1];
      document.head.appendChild(s);
    }
    // 2) 注入 <body> 标记（剔除脚本，避免重复执行）
    var body = html.match(/<body[^>]*>([\s\S]*?)<\/body>/i);
    var markup = body ? body[1] : '';
    var SCRIPTS = new RegExp('<script[\\s\\S]*?<\\/scr' + 'ipt>', 'gi');
    shell.innerHTML = markup.replace(SCRIPTS, '');
    // 3) 注入并执行脚本
    var sc = html.match(/<script[^>]*>([\s\S]*?)<\/script>/i);
    if (!sc) { loadError = 'index.html 中未找到脚本块'; render(); return; }
    var el = document.createElement('script');
    el.textContent = sc[1];
    document.body.appendChild(el);

    loadError = null;
    needFile = false;
    pickWrapHidden(true);
    setTimeout(render, 100);
    setTimeout(render, 600);
    setTimeout(render, 1500);
  }

  function pickWrapHidden(hide) {
    if (pickWrap) pickWrap.style.display = hide ? 'none' : 'block';
  }

  function tryFetchThenPick() {
    // file:// 下 fetch 必然被 CORS 拒绝，且会在控制台留下报错 —— 直接走文件选择器
    if (location.protocol === 'file:') { askForFile(); return; }
    fetch('index.html')
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) { inject(html); })
      .catch(function () { askForFile(); });
  }

  function askForFile() {
    needFile = true;
    pickWrapHidden(false);
    verdict.className = 'verdict warn';
    verdict.textContent = '⚠ 请点击下方按钮选择 index.html';
    report.textContent =
      '当前协议：' + location.protocol + '\n' +
      '浏览器禁止脚本直接读取本地文件（file:// 属于不透明来源），\n' +
      '因此请点击「选择 index.html」按钮手动选择本项目里的 index.html。\n\n' +
      '也可以改用本地服务器（无需手动选择）：\n' +
      '  python -m http.server 8000\n' +
      '  然后访问 http://localhost:8000/diagnose.html';
  }

  tryFetchThenPick();

  if (fileInput) {
    fileInput.addEventListener('change', function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () { inject(String(fr.result)); };
      fr.onerror = function () { loadError = '读取文件失败'; render(); };
      fr.readAsText(f, 'utf-8');
    });
  }

  // ---------------------------------------------------------------- 工具
  function f(v, d) {
    return (v === undefined || v === null || !isFinite(v)) ? '—' : Number(v).toFixed(d === undefined ? 1 : d);
  }
  function canvasEl() { return document.getElementById('game'); }

  // ---------------------------------------------------------------- 采集
  function collect() {
    var o = { err: null, items: [], ok: true, win: {}, canvas: {}, worst: null };
    o.win = {
      innerW: window.innerWidth, innerH: window.innerHeight,
      dpr: window.devicePixelRatio || 1,
      scrollW: document.documentElement.scrollWidth,
      scrollH: document.documentElement.scrollHeight
    };
    var c = canvasEl();
    if (!c) {
      o.err = needFile ? 'NEED_FILE' : '未找到画布 #game（游戏可能未成功注入）';
      return o;
    }

    var r = c.getBoundingClientRect();
    o.canvas = {
      cssW: r.width, cssH: r.height, left: r.left, top: r.top, right: r.right, bottom: r.bottom,
      bufW: c.width, bufH: c.height,
      attrW: Number(c.getAttribute('width')), attrH: Number(c.getAttribute('height')),
      styleW: c.style.width, styleH: c.style.height
    };
    var cv = o.canvas;
    function item(name, ok, detail) {
      o.items.push({ name: name, ok: ok, detail: detail });
      if (!ok) o.ok = false;
    }

    item('画布宽度不超过可见区域', cv.cssW <= o.win.innerW + 0.5, f(cv.cssW) + 'px vs ' + o.win.innerW + 'px');
    item('画布高度不超过可见区域', cv.cssH <= o.win.innerH + 0.5, f(cv.cssH) + 'px vs ' + o.win.innerH + 'px');
    item('画布未越过左/上边界', cv.left >= -0.5 && cv.top >= -0.5, 'left=' + f(cv.left) + ' top=' + f(cv.top));
    item('画布未越过右/下边界', cv.right <= o.win.innerW + 0.5 && cv.bottom <= o.win.innerH + 0.5,
      'right=' + f(cv.right) + ' bottom=' + f(cv.bottom));
    item('缓冲区与显示尺寸一致',
      Math.abs(cv.bufW - cv.cssW) <= 1.5 && Math.abs(cv.bufH - cv.cssH) <= 1.5,
      'buffer ' + cv.bufW + 'x' + cv.bufH + ' vs css ' + f(cv.cssW) + 'x' + f(cv.cssH));
    item('保持 540:960 宽高比', Math.abs(cv.cssH / cv.cssW - 960 / 540) < 0.03,
      '实际 ' + f(cv.cssH / cv.cssW, 4) + '，应为 1.7778');
    item('页面无滚动', o.win.scrollW <= o.win.innerW + 1 && o.win.scrollH <= o.win.innerH + 1,
      'scroll ' + o.win.scrollW + 'x' + o.win.scrollH);

    var hint = document.getElementById('hint');
    if (hint) {
      var hr = hint.getBoundingClientRect();
      var visible = getComputedStyle(hint).display !== 'none' && hr.height > 0;
      if (visible) {
        o.hintGap = hr.top - cv.bottom;
        item('画布未压住底部提示条', o.hintGap >= -0.5, '间距 ' + f(o.hintGap) + 'px（>=0 正常）');
      } else {
        item('底部提示条已隐藏（窗口较矮）', true, 'display=' + getComputedStyle(hint).display);
      }
    }

    try {
      var sw = c.width, sh = c.height;
      var t = document.createElement('canvas');
      t.width = sw; t.height = sh;
      var tx = t.getContext('2d');
      tx.drawImage(c, 0, 0);
      var d = tx.getImageData(0, 0, sw, sh).data;
      var minX = sw, minY = sh, maxX = -1, maxY = -1, lit = 0, n = 0;
      var sx = Math.max(1, Math.floor(sw / 160)), sy = Math.max(1, Math.floor(sh / 240));
      for (var y = 0; y < sh; y += sy) {
        for (var x = 0; x < sw; x += sx) {
          var i = (y * sw + x) * 4; n++;
          if (d[i] + d[i + 1] + d[i + 2] > 150) {
            lit++;
            if (x < minX) minX = x; if (x > maxX) maxX = x;
            if (y < minY) minY = y; if (y > maxY) maxY = y;
          }
        }
      }
      o.contents = {
        n: n, lit: lit, minX: maxX >= 0 ? minX : null, maxX: maxX >= 0 ? maxX : null,
        minY: maxY >= 0 ? minY : null, maxY: maxY >= 0 ? maxY : null
      };
      item('画布内确有渲染内容（非空白）', lit > 0,
        lit > 0 ? ('采样 ' + n + ' 点，命中 ' + lit + ' 点（' + f(100 * lit / n) + '%）') : '画布几乎全黑');
      if (maxX >= 0) {
        item('绘制内容落在画布缓冲区内', minX >= 0 && maxX <= sw && minY >= 0 && maxY <= sh,
          '包围盒 x:' + minX + '..' + maxX + ' y:' + minY + '..' + maxY + '（缓冲 ' + sw + 'x' + sh + '）');
      }
    } catch (e) {
      item('采样画布像素', true, '不可读（' + e.message + '），跳过');
    }

    var ovR = cv.right - o.win.innerW, ovB = cv.bottom - o.win.innerH;
    var ovL = -cv.left, ovT = -cv.top;
    var worst = Math.max(ovR, ovB, ovL, ovT);
    if (worst > 0.5) {
      o.worst = '溢出 ' + f(worst) + 'px（右 ' + f(Math.max(0, ovR)) + ' / 下 ' + f(Math.max(0, ovB)) +
        ' / 左 ' + f(Math.max(0, ovL)) + ' / 上 ' + f(Math.max(0, ovT)) + '）';
    }
    return o;
  }

  // ---------------------------------------------------------------- 渲染
  function render() {
    if (loadError) {
      verdict.className = 'verdict bad';
      verdict.textContent = '❌ ' + loadError.split('\n')[0];
      report.textContent = loadError;
      return;
    }
    var o = collect();
    rows.innerHTML = '';
    function row(k, v, cls) {
      var tr = document.createElement('tr');
      var td1 = document.createElement('td'); td1.textContent = k;
      var td2 = document.createElement('td'); td2.className = 'v' + (cls ? ' ' + cls : '');
      td2.textContent = v;
      tr.appendChild(td1); tr.appendChild(td2); rows.appendChild(tr);
    }
    if (o.err) {
      if (o.err === 'NEED_FILE') {
        // 在等用户选择文件：保持引导文案，且不要覆盖选择器的显示
        verdict.className = 'verdict warn';
        verdict.textContent = '⚠ 请点击下方按钮选择 index.html';
        return;
      }
      verdict.className = 'verdict warn';
      verdict.textContent = '⚠ ' + o.err;
      report.textContent = o.err;
      return;
    }
    verdict.className = 'verdict ' + (o.ok ? 'ok' : 'bad');
    verdict.textContent = o.ok ? ('✅ 未检测到显示问题' + (o.worst ? '（' + o.worst + '）' : ''))
      : ('❌ 检测到显示问题' + (o.worst ? '：' + o.worst : ''));

    var cv = o.canvas;
    row('窗口视口', o.win.innerW + ' × ' + o.win.innerH + '   dpr=' + o.win.dpr);
    row('画布显示尺寸 (CSS)', f(cv.cssW) + ' × ' + f(cv.cssH));
    row('画布缓冲区尺寸', cv.bufW + ' × ' + cv.bufH);
    row('画布 HTML 属性尺寸', cv.attrW + ' × ' + cv.attrH + '   style: ' + cv.styleW + ' / ' + cv.styleH);
    row('画布位置 left / top', f(cv.left) + ' / ' + f(cv.top));
    row('画布右下角 right / bottom', f(cv.right) + ' / ' + f(cv.bottom));
    row('页面滚动尺寸', o.win.scrollW + ' × ' + o.win.scrollH);
    if (o.hintGap !== undefined) row('画布与提示条间距', f(o.hintGap) + 'px');
    if (o.contents && o.contents.lit) {
      row('绘制内容包围盒', 'x ' + o.contents.minX + '..' + o.contents.maxX +
        '  y ' + o.contents.minY + '..' + o.contents.maxY);
    }
    o.items.forEach(function (it) { row((it.ok ? '✅ ' : '✗ ') + it.name, it.detail, it.ok ? '' : 'fail'); });

    if (showOutline) {
      outline.style.display = 'block';
      outline.style.left = cv.left + 'px';
      outline.style.top = cv.top + 'px';
      outline.style.width = cv.cssW + 'px';
      outline.style.height = cv.cssH + 'px';
    } else {
      outline.style.display = 'none';
    }

    var L = [];
    L.push('=== 雷霆战机 显示诊断 ===');
    L.push('时间: ' + new Date().toLocaleString());
    L.push('UA: ' + navigator.userAgent);
    L.push('页面协议: ' + location.protocol);
    L.push('窗口视口: ' + o.win.innerW + 'x' + o.win.innerH + ' dpr=' + o.win.dpr);
    L.push('画布 CSS: ' + f(cv.cssW) + 'x' + f(cv.cssH) + ' @ (' + f(cv.left) + ',' + f(cv.top) + ') -> (' + f(cv.right) + ',' + f(cv.bottom) + ')');
    L.push('画布 buffer: ' + cv.bufW + 'x' + cv.bufH + '   属性: ' + cv.attrW + 'x' + cv.attrH);
    L.push('页面滚动: ' + o.win.scrollW + 'x' + o.win.scrollH);
    if (o.hintGap !== undefined) L.push('画布与提示条间距: ' + f(o.hintGap) + 'px');
    L.push('结论: ' + (o.ok ? '未检出异常' : '检出异常 ' + (o.worst || '')));
    L.push('--- 明细 ---');
    o.items.forEach(function (it) { L.push((it.ok ? '[OK] ' : '[FAIL] ') + it.name + ' :: ' + it.detail); });
    report.textContent = L.join('\n');
  }

  // ---------------------------------------------------------------- 交互
  document.getElementById('diagOutlineBtn').addEventListener('click', function () { showOutline = !showOutline; render(); });
  document.getElementById('diagHideBtn').addEventListener('click', function () { panel.classList.add('hidden'); tab.classList.remove('hidden'); render(); });
  tab.addEventListener('click', function () { panel.classList.remove('hidden'); tab.classList.add('hidden'); render(); });
  document.getElementById('diagOpenBtn').addEventListener('click', function () { window.open('index.html', '_blank'); });
  document.getElementById('diagCopyBtn').addEventListener('click', function () {
    var t = report.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { alert('已复制，可直接粘贴给我'); },
        function () { alert('复制失败，请手动选中报告文本'); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); alert('已复制'); } catch (e) { alert('请手动复制'); }
      document.body.removeChild(ta);
    }
  });

  document.getElementById('diagSizeBtn').addEventListener('click', function () {
    var sizes = [[1600, 900], [1280, 900], [1000, 700], [800, 600], [500, 580], [390, 844], [360, 640], [320, 480], [1200, 300]];
    var c = canvasEl();
    if (!c) { alert('画布未就绪'); return; }
    var lines = ['--- 多尺寸测试 ---'];
    var i = 0;
    function next() {
      if (i >= sizes.length) {
        shell.style.cssText = 'position:fixed; inset:0; overflow:hidden;';
        window.dispatchEvent(new Event('resize'));
        report.textContent = report.textContent + '\n' + lines.join('\n');
        render();
        return;
      }
      var s = sizes[i++];
      shell.style.cssText = 'position:fixed; left:0; top:0; overflow:hidden; width:' + s[0] + 'px; height:' + s[1] + 'px;';
      window.dispatchEvent(new Event('resize'));
      setTimeout(function () {
        var rr = c.getBoundingClientRect();
        var fits = rr.left >= -0.5 && rr.top >= -0.5 && rr.right <= s[0] + 0.5 && rr.bottom <= s[1] + 0.5;
        var hint = document.getElementById('hint');
        var gap = null;
        if (hint) {
          var hr = hint.getBoundingClientRect();
          if (getComputedStyle(hint).display !== 'none') gap = hr.top - rr.bottom;
        }
        lines.push((fits ? '  完整 ' : '  溢出 ') + s[0] + 'x' + s[1] +
          '  画布 ' + f(rr.width, 0) + 'x' + f(rr.height, 0) +
          '  [' + f(rr.top, 0) + '..' + f(rr.bottom, 0) + ']' +
          (gap === null ? '  提示条隐藏' : '  间距 ' + f(gap) + 'px'));
        next();
      }, 260);
    }
    next();
  });

  window.addEventListener('resize', function () { render(); });
  setInterval(render, 1200);
})();
</script>
</body>
</html>
